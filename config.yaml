# arXiv open questions feed -- settings.
#
# Secrets and email addresses are not in this file. They come from the
# environment: ANTHROPIC_API_KEY, SMTP_PASSWORD, LAKERA_GUARD_API_KEY,
# FEED_EMAIL_TO, SMTP_USER. See the README.

# ---------------------------------------------------------------------------
# arXiv lists to read each day.
#
# arXiv has no bare `econ` list to query, so its three real lists are named.
# Together these give about 200-500 new papers a day.
# ---------------------------------------------------------------------------
categories:
  - cs.MA      # Multiagent Systems
  - cs.AI      # Artificial Intelligence
  - cs.LG      # Machine Learning
  - cs.DC      # Distributed, Parallel, and Cluster Computing
  - econ.GN    # General Economics
  - econ.TH    # Theoretical Economics
  - econ.EM    # Econometrics

