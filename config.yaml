# arXiv open questions feed -- configuration.
#
# Everything the daily run needs except the two secrets, which come from the
# environment (see README): ANTHROPIC_API_KEY and SMTP_PASSWORD.

# ---------------------------------------------------------------------------
# arXiv lists to read each day.
#
# The spec names "econ" as one entry. arXiv has no bare `econ` list to query --
# it is an archive with three lists -- so all three are named here explicitly.
# Together these run ~300-600 new papers on a weekday, which is the volume the
# spec's cost estimates assume.
# ---------------------------------------------------------------------------
categories:
  - cs.MA      # Multiagent Systems
  - cs.AI      # Artificial Intelligence
  - cs.LG      # Machine Learning
  - cs.DC      # Distributed, Parallel, and Cluster Computing
  - econ.GN    # General Economics
  - econ.TH    # Theoretical Economics
  - econ.EM    # Econometrics

