# arXiv open questions feed -- settings.
#
# Secrets and email addresses are not in this file. They come from the
# environment: OPENROUTER_API_KEY, SMTP_PASSWORD, LAKERA_GUARD_API_KEY,
# FEED_EMAIL_TO, SMTP_USER. See the README.

# ---------------------------------------------------------------------------
# arXiv lists to read each day.
#
# arXiv has no bare `econ` list to query, so its three real lists are named.
# Together these give about 200-500 new papers a day.
# ---------------------------------------------------------------------------
categories:
  - cs.MA      # Multiagent Systems
  - cs.AI      # Artificial Intelligence
  - cs.LG      # Machine Learning
  - cs.DC      # Distributed, Parallel, and Cluster Computing
  - econ.GN    # General Economics
  - econ.TH    # Theoretical Economics
  - econ.EM    # Econometrics

# ---------------------------------------------------------------------------
# Search queries: pull in a paper by topic even outside the categories above.
#
# Matched against title, abstract and comments (arXiv's `all:` field), OR'd
# into the same day's query. A paper about gradual disempowerment tagged only
# cs.CY, outside every category above, is still fetched if its abstract uses
# the phrase.
# ---------------------------------------------------------------------------
search_queries:
  - "gradual disempowerment"
  - "power concentration"
  - "cooperative ai"
  - "large multi-agent systems"
  - "social-scale ai"

# ---------------------------------------------------------------------------
# Anchor papers: work already known to be in the field.
#
# These no longer decide what gets read. They only order the day so that a
# listing larger than screen_n can be cut to screen_n. On a day under the cap
# the anchors change nothing at all -- every paper is screened regardless.
#
# 20 of the 42-paper LAS canon's 33 arXiv entries, kept for two themes:
# gradual disempowerment, and dynamics that only appear in very large agent
# populations. Papers whose contribution is a framework, protocol, dataset or
# other piece of infrastructure are left out, even when the subject matter
# fits -- an anchor should be a finding, not a tool. See PR history for the
# 13 dropped and why.
#
# The other 22 canon entries (13 dropped here, 9 with no arXiv ID) are not
# anchors, but stay in data/ground-truth/ as canon.
#
# Add or remove any of them. The vectors rebuild on the next run.
# ---------------------------------------------------------------------------
anchors:
  - "2503.13395"  # Causal Emergence 2.0: Quantifying Emergent Complexity
  - "2411.11581"  # OASIS: Open Agent Social Interaction Simulations with One Million Agents
  - "2512.02682"  # Beyond Single-Agent Safety: A Taxonomy of Risks in LLM-to-LLM Interactions
  - "2605.24413"  # Habermolt: Delegating Deliberation to AI Representatives
  - "2409.02822"  # AI agents can coordinate beyond human scale
  - "2602.16136"  # Retrieval Collapses When AI Pollutes the Web
  - "2409.10568"  # On the Limits of Agency in Agent-Based Models
  - "2603.23471"  # Regulating AI Agents
  - "2502.14143"  # Multi-Agent Risks from Advanced AI
  - "2509.01063"  # An Economy of AI Agents
  - "2510.22422"  # Group size effects and collective misalignment in LLM multi-agent systems
  - "2501.16946"  # Gradual Disempowerment: Systemic Existential Risks from Incremental AI Development
  - "2502.08691"  # AgentSociety: Large-Scale Simulation of LLM-Driven Generative Agents Advances Understanding of Human Behaviors and Society
  - "2602.11865"  # Intelligent AI Delegation
  - "2604.10290"  # AI Organizations are More Effective but Less Aligned than Individual Agents
  - "2506.12078"  # Modeling Earth-Scale Human-Like Societies with One Billion Agents
  - "2512.16856"  # Distributional AGI Safety
  - "2605.13860"  # The Moltbook Observatory Archive: an incremental dataset of agent-only social network activity
  - "2604.15236"  # Agentic Microphysics: A Manifesto for Generative AI Safety
  - "2509.10147"  # Virtual Agent Economies

# ---------------------------------------------------------------------------
# Your background, skills and projects, in about 300 words.
#
# Both model calls read it: to score significance for you, and to decide
# whether a question is approachable by you.
#
# Change this first if the emails are interesting but not useful.
# ---------------------------------------------------------------------------
profile: |
  I work on large agent systems: the economies, markets, social networks and
  organisations that emerge when many AI agents interact with each other and
  with people at scale. My interest is system-level rather than model-level.
  A paper about making one agent more capable is not for me; a paper about
  what happens when thousands of such agents transact, coordinate, compete,
  collude or deceive each other is.

  Concretely I care about: multi-agent simulation of societies and markets
  (generative-agent simulations, agent-based models, digital twins of
  populations); the observability of these systems (what can be measured
  from aggregate behaviour, from interaction logs, or from the agents
  themselves); mechanism and market design for populations that include
  autonomous agents; monitoring and steering interventions that work at the
  population level; and the failure modes that only appear in aggregate --
  systemic instability, herding and monoculture, collusion, information
  cascades, gradual disempowerment of human decision-makers, and
  concentration of power.

  My background is applied and empirical rather than pure theory. I can
  implement and run simulations, train and evaluate models, work with
  network and time-series data, do econometric and causal analysis, and
  build and analyse scraped datasets. I read economics and complex-systems
  work comfortably but I am not a theorist: I can use a mechanism-design
  result, not prove a new one. I do not run human-subject experiments and I
  have no access to proprietary platform data, so questions that require
  either are not approachable for me even when they are interesting.

  I am looking for open questions I could actually start on within a few
  weeks with public data, public APIs, or a simulation I can write myself.
  Questions that require frontier-scale pretraining compute, a large
  engineering team, or privileged access to a deployed platform are not
  approachable.

# ---------------------------------------------------------------------------
# Pipeline sizes.
#
# Every paper up to screen_n reaches the screening model. The old similarity
# shortlist (40 by similarity + 5 at random) is gone: it decided relevance on a
# signal that could not carry that decision -- on a measured day the papers at
# ranks 10 to 40 were separated by 0.0004 cosine, which is noise. See
# docs/ranking-report.md.
# ---------------------------------------------------------------------------
screen_n: 200          # max papers sent to the screening model in a day
screen_batch_size: 25  # papers per screening call; batch-mates calibrate each other
top_n: 10              # papers kept after the judging call

# ---------------------------------------------------------------------------
# Models.
# ---------------------------------------------------------------------------
# Embedding model, loaded locally. SPECTER2 is trained on paper titles and
# abstracts, which is the exact input here. See the README for the pooling and
# adapter notes.
embed_model: allenai/specter2_base

# Where the embedding model runs. CPU by default and on purpose: the work is a
# few hundred abstracts through a BERT-base encoder, and the daily job runs in
# GitHub Actions, which has no GPU. Taking a GPU here only makes the run
# compete with other work on the machine, and a process holding GPU memory for
# its whole length is one something else can reap. Set to cuda if the GPUs are
# yours alone.
embed_device: cpu

# Three calls, three models, all OpenRouter model ids. The code makes no
# provider assumption -- any id OpenRouter lists works.
# List: https://openrouter.ai/models
#
# screen_model  call 1: reads every paper, answers "relevant?" yes/no.
#               Cheap, because it reads up to screen_n papers a day.
# judge_model   call 2: reads what passed, scores significance and novelty.
# model         call 3: one question-extraction call per kept paper.
#
# Measured cost at 150 papers/day: about $0.10 screening + $0.11 judging,
# roughly what the single Opus scoring call cost when it read only 45 papers.
screen_model: anthropic/claude-haiku-4.5
judge_model: anthropic/claude-sonnet-5
model: anthropic/claude-opus-5

# Reasoning effort. OpenRouter passes this to the provider as reasoning_effort.
# Not every model supports it; unsupported models ignore it.
# Values: low | medium | high | xhigh | max.
#
# The screen runs lower than the rest. Measured on 2026-08-20 at effort medium,
# reasoning was 9,824 of the screen's 16,631 output tokens -- a third of its
# cost -- to answer one yes/no question per paper. The judge and the question
# call keep the higher setting: those are the calls that need to reason.
effort: medium
screen_effort: low

# ---------------------------------------------------------------------------
# Defences for untrusted text (arXiv titles and abstracts).
#
# The structural defences always run. They need no key and no network:
# invisible characters removed, length capped, each abstract fenced under a
# "this is data" prompt. Keyword annotation also always runs. Neither one is
# configured here.
#
# This block configures only the Lakera screening layer above them.
#
# Lakera is off. arXiv is a trusted source. Every paper is a moderated
# submission with named authors and a public record. The false-positive cost
# is higher than the attack risk: on 2026-08-22 Lakera blocked 19 of 155
# papers, and one of them was `2608.20231` (Growth Without Us), the day's
# strongest on-theme paper. It was flagged `prompt_attack`. It is an abstract
# about machine consumers.
#
# Set `enabled: true` and supply $LAKERA_GUARD_API_KEY to turn it back on.
# With no key the run warns, says so in the email, and continues.
# ---------------------------------------------------------------------------
guard:
  enabled: false
  # project_id: project-xxxxxxxx   # optional: screen under a specific Lakera policy
  endpoint: https://api.lakera.ai/v2/guard
  timeout_seconds: 20
  # What an unreachable Lakera means. `allow` keeps the day's email and
  # reports the failure. `block` withholds every paper it could not screen.
  on_error: allow
  max_title_chars: 500
  max_abstract_chars: 6000

# ---------------------------------------------------------------------------
# RSS/Atom feed. On every run, this repository writes data/feed.xml from
# every day file on disk. No password, no account: a feed reader polls a URL.
#
# base_url must point at where this repository is served as plain files.
# Two options:
#
#   GitHub Pages (correct Content-Type for a feed; needs a one-time setting)
#     Enable it: repo Settings -> Pages -> Deploy from a branch -> main -> /
#     Then: https://<owner>.github.io/<repo>
#
#   raw.githubusercontent.com (works with no setup; wrong Content-Type)
#     Measured: served as text/plain, not an XML type. Most feed readers
#     still accept it, because they read the file's content, not just the
#     header, but this is not guaranteed for every reader.
#     https://raw.githubusercontent.com/<owner>/<repo>/main
#
# The default below is the second option, so the feed works with zero setup.
# Switch to the first once Pages is on.
# ---------------------------------------------------------------------------
feed:
  base_url: https://raw.githubusercontent.com/one-2/las-new-papers/main
  max_entries: 60    # about two months of daily runs

# ---------------------------------------------------------------------------
# Email delivery. Optional: the feed above delivers every run on its own.
# Set FEED_EMAIL_TO to also get a daily email; leave it unset for feed-only,
# no SMTP account or app password needed.
#
# No address is stored in this file. This repository is public, and an address
# in a public file is scraped. Addresses come from the environment:
#
#   FEED_EMAIL_TO    where the digest is sent          (required to send)
#   FEED_EMAIL_FROM  the From: header                  (optional, defaults to FEED_EMAIL_TO)
#   SMTP_USER        the account that logs in to send  (optional, defaults to FEED_EMAIL_FROM)
#   SMTP_PASSWORD    that account's app password       (required to send)
#
# Only the server settings, which identify nobody, are here.
# ---------------------------------------------------------------------------
smtp_host: smtp.gmail.com
smtp_port: 587
