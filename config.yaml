# ---------------------------------------------------------------------------
# Your background, skills and projects, in about 300 words.
#
# Both model calls read it: to score significance for you, and to decide
# whether a question is approachable by you.
#
# Change this first if the emails are interesting but not useful.
# ---------------------------------------------------------------------------
profile: |
  I work on large agent systems: the economies, markets, social networks and
  organisations that emerge when many AI agents interact with each other and
  with people at scale. My interest is system-level rather than model-level.
  A paper about making one agent more capable is not for me; a paper about
  what happens when thousands of such agents transact, coordinate, compete,
  collude or deceive each other is.

  Concretely I care about: multi-agent simulation of societies and markets
  (generative-agent simulations, agent-based models, digital twins of
  populations); the observability of these systems (what can be measured
  from aggregate behaviour, from interaction logs, or from the agents
  themselves); mechanism and market design for populations that include
  autonomous agents; monitoring and steering interventions that work at the
  population level; and the failure modes that only appear in aggregate --
  systemic instability, herding and monoculture, collusion, information
  cascades, gradual disempowerment of human decision-makers, and
  concentration of power.

  My background is applied and empirical rather than pure theory. I can
  implement and run simulations, train and evaluate models, work with
  network and time-series data, do econometric and causal analysis, and
  build and analyse scraped datasets. I read economics and complex-systems
  work comfortably but I am not a theorist: I can use a mechanism-design
  result, not prove a new one. I do not run human-subject experiments and I
  have no access to proprietary platform data, so questions that require
  either are not approachable for me even when they are interesting.

  I am looking for open questions I could actually start on within a few
  weeks with public data, public APIs, or a simulation I can write myself.
  Questions that require frontier-scale pretraining compute, a large
  engineering team, or privileged access to a deployed platform are not
  approachable.

# ---------------------------------------------------------------------------
# Filter and scoring sizes.
# ---------------------------------------------------------------------------
shortlist_n: 40      # papers kept by similarity
explore_n: 5         # random papers added from the next 100 (anti-tunnel-vision)
top_n: 10            # papers kept after the scoring call

# ---------------------------------------------------------------------------
# Models.
# ---------------------------------------------------------------------------
# Embedding model, loaded locally. SPECTER2 is trained on paper titles and
# abstracts, which is the exact input here. See the README for the pooling and
# adapter notes.
embed_model: allenai/specter2_base

# Model for the two calls (scoring, question extraction).
model: claude-opus-5

# Reasoning effort for the model calls: low | medium | high | xhigh | max.
effort: medium

# ---------------------------------------------------------------------------
# Defences for untrusted text (arXiv titles and abstracts).
#
# The structural defences always run and need no key: invisible characters
# removed, length capped, each abstract fenced under a "this is data" prompt.
# This block configures only the Lakera screening layer above them.
#
# The key comes from $LAKERA_GUARD_API_KEY. With no key the run warns, says so
# in the email, and continues.
# ---------------------------------------------------------------------------
guard:
  enabled: true
  # project_id: project-xxxxxxxx   # optional: screen under a specific Lakera policy
  endpoint: https://api.lakera.ai/v2/guard
  timeout_seconds: 20
  # What an unreachable Lakera means. `allow` keeps the day's email and
  # reports the failure. `block` withholds every paper it could not screen.
  on_error: allow
  max_title_chars: 500
  max_abstract_chars: 6000

# ---------------------------------------------------------------------------
# Email delivery.
#
# No address is stored in this file. This repository is public, and an address
# in a public file is scraped. Addresses come from the environment:
#
#   FEED_EMAIL_TO    where the digest is sent          (required to send)
#   FEED_EMAIL_FROM  the From: header                  (optional, defaults to FEED_EMAIL_TO)
#   SMTP_USER        the account that logs in to send  (optional, defaults to FEED_EMAIL_FROM)
#   SMTP_PASSWORD    that account's app password       (required to send)
#
# Only the server settings, which identify nobody, are here.
# ---------------------------------------------------------------------------
smtp_host: smtp.gmail.com
smtp_port: 587
