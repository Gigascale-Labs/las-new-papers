name: Daily arXiv open-questions feed

on:
  schedule:
    # 07:23 UTC daily. Off the hour to miss the top-of-hour Actions crunch, and
    # late enough that arXiv's previous UTC day is fully announced.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to read (YYYY-MM-DD). Blank = yesterday."
        required: false
      dry_run:
        description: "Write the JSON but send no email"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Two runs writing data/ and pushing at once would conflict; a manual
  # dispatch during the scheduled run waits rather than races.
  group: daily-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The embedding model is a ~440MB download and never changes between runs.
      # Cached on the model name, so switching embed_model invalidates it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: hf-${{ runner.os }}-

      # Anchor vectors are derived state (gitignored). Cached on config.yaml, so
      # editing the anchor list rebuilds them on the next run -- which is the
      # same rule the code applies locally.
      - name: Cache anchor vectors
        uses: actions/cache@v4
        with:
          path: |
            data/anchors.npy
            data/anchors.meta.json
          key: anchors-${{ hashFiles('config.yaml') }}

      - name: Run the feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional. Without it the run still applies its structural defences
          # and says so in the email, rather than failing.
          LAKERA_GUARD_API_KEY: ${{ secrets.LAKERA_GUARD_API_KEY }}
        run: |
          python main.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when the step above failed: a run that produced its JSON but
      # could not send the email exits non-zero on purpose, and that day's
      # archive is still worth keeping.
      - name: Commit the day's archive
        if: always()
        run: |
          git config user.name "arxiv-feed[bot]"
          git config user.email "bot@largeagentsystems.org"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          DAY=$(date -u -d yesterday +%Y-%m-%d)
          git commit -m "data: arXiv open-questions feed for ${DAY} [skip ci]"
          git push
