name: Daily arXiv open-questions feed

on:
  schedule:
    # 07:23 UTC daily. Off the hour to miss the Actions rush, and late enough
    # that arXiv's previous UTC day is complete.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to read (YYYY-MM-DD). Blank = yesterday."
        required: false
      dry_run:
        description: "Write the JSON but do not mark papers as seen"
        type: boolean
        default: false
      test_failure_alert:
        description: "Test the failure issue: a dry run with a broken OpenRouter key that commits nothing"
        type: boolean
        default: false

permissions:
  contents: write
  # The failure step at the end opens or comments on an issue.
  issues: write

concurrency:
  # Two runs writing data/ at once would conflict. A manual run waits for the
  # scheduled one.
  group: daily-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The embedding model is a 440MB download and never changes between
      # runs. Keyed on config.yaml, so changing embed_model refetches it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: hf-${{ runner.os }}-

      # Anchor vectors are derived state, so they are gitignored and cached.
      # Editing the anchor list rebuilds them, the same rule the code uses
      # locally.
      - name: Cache anchor vectors
        uses: actions/cache@v4
        with:
          path: |
            data/anchors.npy
            data/anchors.meta.json
          key: anchors-${{ hashFiles('config.yaml') }}

      - name: Run the feed
        # An explicit `shell: bash` turns on pipefail, so the tee cannot hide
        # main.py's exit code. The log feeds the failure issue below.
        shell: bash
        env:
          # test_failure_alert swaps in a key OpenRouter rejects, so every
          # model call fails the way an exhausted key does.
          OPENROUTER_API_KEY: ${{ inputs.test_failure_alert && 'sk-or-v1-failure-alert-test' || secrets.OPENROUTER_API_KEY }}
          # Optional. Without it the run still applies the structural
          # defences and says so in the feed.
          LAKERA_GUARD_API_KEY: ${{ secrets.LAKERA_GUARD_API_KEY }}
          # Piped stdout is block-buffered. Unbuffered keeps the summary lines
          # in order with the log lines.
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ (inputs.dry_run || inputs.test_failure_alert) && '--dry-run' || '' }} \
            2>&1 | tee "$RUNNER_TEMP/run.log"

      # Runs even if the step above failed. A run that wrote its JSON but
      # rebuilt an empty feed exits non-zero, and that day's archive is
      # still worth keeping.
      # A failure-alert test commits nothing: its day file holds the fake
      # key's errors.
      - name: Commit the day's archive
        if: always() && !inputs.test_failure_alert
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          git config user.name "arxiv-feed[bot]"
          git config user.email "bot@largeagentsystems.org"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # A manual run for a given date names that date, not yesterday.
          DAY="${DATE_INPUT:-$(date -u -d yesterday +%Y-%m-%d)}"
          git commit -m "data: arXiv open-questions feed for ${DAY} [skip ci]"

          # This job runs for tens of minutes, so main can move under it. A
          # plain push then loses the whole day's work -- fetched, screened,
          # judged and paid for -- to a race it could have just rebased past.
          # Only data/ is touched here, and the concurrency group means no
          # other run of this workflow is writing it, so a rebase is safe.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "could not push after 3 attempts"
          exit 1

      # A red job alone does not reach anyone reliably. GitHub emails a
      # scheduled run's failure only to the account that last edited the cron
      # line, and only if that account has Actions notifications on. From
      # 2026-09-04 to 2026-09-09 the OpenRouter key was exhausted, six days
      # sent nothing, and nobody heard. An @-mention in an issue notifies that
      # account whatever its watch and Actions settings are.
      #
      # One open issue collects every failure until someone closes it, so a
      # week of failures is one thread, not seven.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # The account to notify. Space-separate to add more.
          MENTION: "@one-2"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # A test gets its own issue, so a real failure never lands on it.
          TITLE: ${{ inputs.test_failure_alert && 'Test of the daily feed failure alert' || 'Daily feed run failed' }}
        run: |
          LOG="$RUNNER_TEMP/run.log"
          SUMMARY="$RUNNER_TEMP/summary.txt"
          BODY="$RUNNER_TEMP/issue.md"
          {
            echo "${MENTION} the daily feed run failed: ${RUN_URL}"
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              # main.py's own summary: one line per day, then its failures and
              # problems. A crash prints none of these, so fall back to the
              # log's tail.
              grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}: |^  (FAILED|problem): |^model calls failed' "$LOG" \
                | head -n 60 > "$SUMMARY" || true
              if [ -s "$SUMMARY" ]; then cat "$SUMMARY"; else tail -n 40 "$LOG"; fi
            else
              echo "main.py did not run. The run log names the step that failed."
            fi
            echo '```'
          } > "$BODY"

          N=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi
